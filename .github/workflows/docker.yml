# Builds the ACP Router image from apps/acprouter/Dockerfile and pushes
# multi-arch (amd64 + arm64) to GHCR, on GitHub's official ubuntu-latest
# runner. GHCR uses the built-in GITHUB_TOKEN — no extra secret needed to get
# this running.
name: Docker

on:
  push:
    branches: [main]
    paths:
      - "apps/acprouter/**"
      - "packages/acprouter-core/**"
      - "packages/acprouter-contract/**"
      - "packages/kui/**"
      - "packages/openlib/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker.yml"
      # docs/readme assets don't affect the image — don't rebuild on those edits
      - "!apps/acprouter/README.md"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute version and tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(jq -r '.version' apps/acprouter/package.json)
          short_sha="${GITHUB_SHA::7}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            build_meta="release.${GITHUB_RUN_NUMBER}.${short_sha}"
          else
            build_meta="alpha.${GITHUB_RUN_NUMBER}.${short_sha}"
          fi
          semver="${package_version}-${build_meta}"

          tags="${semver}
          v${semver}
          ${package_version}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags}
          latest"
          fi
          tags=$(printf '%s\n' "${tags}" | sed 's/^[[:space:]]*//')

          {
            echo "tag_values<<__TAGS_EOF__"
            echo "${tags}"
            echo "__TAGS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker tags
        id: tags
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/acprouter
          TAGS: ${{ steps.version.outputs.tag_values }}
        run: |
          set -euo pipefail
          refs=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && refs+=("${IMAGE}:${tag}")
          done <<< "$TAGS"
          {
            echo "tags<<__TAGS_EOF__"
            printf '%s\n' "${refs[@]}"
            echo "__TAGS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/acprouter/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
